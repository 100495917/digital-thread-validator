const colors = {"CodeModule": "#59a14f", "Commit": "#9c755f", "ModelElement": "#f28e2b", "Release": "#bab0ac", "Report": "#76b7b2", "Requirement": "#4e79a7", "Test": "#e15759", "TestResult": "#b07aa1"};

const legend = d3.select("#legend");
const types = Array.from(new Set(graph.nodes.map((node) => node.type))).sort();
types.forEach((type) => {
  legend.append("span")
    .html('<i style="background:' + (colors[type] || "#cccccc") + '"></i>' + type);
});

const svg = d3.select("#thread");
const width = 1200;
const height = 720;
svg.attr("viewBox", "0 0 " + width + " " + height);

const simulation = d3.forceSimulation(graph.nodes)
  .force("link", d3.forceLink(graph.edges).id((node) => node.id).distance(90))
  .force("charge", d3.forceManyBody().strength(-260))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collide", d3.forceCollide(28));

svg.append("defs").append("marker")
  .attr("id", "arrow")
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 12)
  .attr("refY", 0)
  .attr("markerWidth", 6)
  .attr("markerHeight", 6)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M0,-5L10,0L0,5")
  .attr("fill", "#777");

const link = svg.append("g")
  .selectAll("line")
  .data(graph.edges)
  .join("line")
  .attr("class", "link")
  .attr("marker-end", "url(#arrow)");

const node = svg.append("g")
  .selectAll("g")
  .data(graph.nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    })
    .on("drag", (event, d) => {
      d.fx = event.x;
      d.fy = event.y;
    })
    .on("end", (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }));

node.append("circle")
  .attr("r", 6)
  .attr("fill", (d) => colors[d.type] || "#cccccc")
  .attr("stroke", "#333");

node.append("text")
  .attr("x", 9)
  .attr("y", 3)
  .text((d) => d.label ? d.label + " (" + d.id + ")" : d.id);

node.append("title").text((d) => d.type + " " + d.id);

simulation.on("tick", () => {
  link
    .attr("x1", (d) => d.source.x)
    .attr("y1", (d) => d.source.y)
    .attr("x2", (d) => d.target.x)
    .attr("y2", (d) => d.target.y);
  node.attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");
});
</script>
