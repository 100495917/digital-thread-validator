name: CI

on:
  push:
    paths:
      - "requirements/**"
      - "models/**"
      - "src/**"
      - "tests/**"
      - "pipeline/**"
      - "infra/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "requirements/**"
      - "models/**"
      - "src/**"
      - "tests/**"
      - "pipeline/**"
      - "infra/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-validate:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for the commit message checks.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate requirements and model
        run: mbse validate all

      - name: Check commit messages
        run: mbse commits check

  trace-check:
    name: Traceability check
    needs: [lint-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check traceability
        run: mbse trace check

  generate:
    name: Generate artifacts
    needs: [lint-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate docs, diagrams, stubs, and SBOM
        run: mbse generate all

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-artifacts
          path: |
            docs/generated/
            build/diagrams/
            build/stubs/
            build/openapi.json
            build/reports/sbom.json
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Test
    needs: [lint-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          mkdir -p build/reports
          pytest

      - name: Check requirements coverage
        run: mbse reqcov

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/junit.xml
            build/reports/coverage.xml
            build/reports/pytest.html
            build/reports/req_results.json
            build/reports/reqcov.json
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Security
    needs: [lint-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run security gate
        run: mbse security

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/security.json
            build/reports/security.sarif
          if-no-files-found: warn
          retention-days: 30

  thread-update:
    name: Update digital thread
    needs: [test, security, generate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for git-based node versioning.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Update digital thread
        run: mbse thread update

      - name: Upload digital thread
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-thread
          path: |
            digital_thread/
            build/reports/thread_diff.md
          if-no-files-found: warn
          retention-days: 30

  impact:
    name: Impact analysis
    needs: [trace-check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required to diff against the base reference.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Analyse impact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          mbse impact --base "$BASE" --head HEAD

      - name: Upload impact reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-reports
          path: |
            build/reports/impact.json
            build/reports/impact.md
            build/reports/rtm_diff.md
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Aggregate report
    needs: [lint-validate, trace-check, generate, test, security, thread-update, impact]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Download test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: build/reports

      - name: Download security reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: build/reports

      - name: Download impact reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: impact-reports
          path: build/reports

      - name: Download digital thread
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: digital-thread
          path: .

      - name: Download generated artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: generated-artifacts
          path: .

      - name: Build aggregate report
        run: |
          mkdir -p build/reports
          mbse report

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-artifacts
          path: |
            build/reports/
            docs/reports/
          if-no-files-found: warn
          retention-days: 30

  deploy-staging:
    name: Deploy to staging
    needs: [test, security, report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Bring up staging stack
        env:
          IMAGE_TAG: ${{ github.sha }}
          THERMOSTAT_API_TOKEN: ${{ secrets.THERMOSTAT_API_TOKEN }}
        run: |
          mkdir -p build/reports
          docker compose -f infra/docker-compose.staging.yml up -d

      - name: Wait for the API
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/status >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.staging.yml logs
          exit 1

      - name: Run smoke tests
        env:
          THERMOSTAT_API_TOKEN: ${{ secrets.THERMOSTAT_API_TOKEN }}
        run: |
          python3 scripts/smoke_test.py \
            --base-url http://127.0.0.1:8000 \
            --token "${THERMOSTAT_API_TOKEN:-dev-token}"

      - name: Collect staging logs
        if: always()
        run: |
          mkdir -p build/reports
          docker compose -f infra/docker-compose.staging.yml logs \
            > build/reports/staging-compose.log 2>&1 || true

      - name: Upload staging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs
          path: build/reports/staging-compose.log
          if-no-files-found: warn
          retention-days: 30

  production:
    name: Production (manual approval)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production placeholder
        run: |
          echo "Staging deployment succeeded."
          echo "Production deployment requires approval of the production environment."
