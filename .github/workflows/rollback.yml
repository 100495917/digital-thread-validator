name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA) to redeploy"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back deployment
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      THERMOSTAT_API_TOKEN: ${{ secrets.THERMOSTAT_API_TOKEN || 'dev-token' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          # Compose runs the local image name; expose the pulled tag under it.
          docker tag "ghcr.io/${{ github.repository }}:${IMAGE_TAG}" \
            "digital-thread-validator:${IMAGE_TAG}"

      - name: Recreate services with the previous image
        run: |
          docker compose -f infra/docker-compose.staging.yml down --remove-orphans || true
          docker compose -f infra/docker-compose.staging.yml up -d --no-build --remove-orphans

      - name: Wait for API health
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/status

      - name: Run smoke tests
        run: |
          python scripts/smoke_test.py \
            --base-url http://127.0.0.1:8000 \
            --token "$THERMOSTAT_API_TOKEN"

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p build/reports
          docker compose -f infra/docker-compose.staging.yml logs --no-color \
            > build/reports/rollback-compose.log 2>&1 || true

      - name: Upload rollback logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-logs
          path: build/reports/rollback-compose.log
          retention-days: 30
          if-no-files-found: warn
