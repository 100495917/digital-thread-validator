name: Security

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "requirements/**"
      - "models/**"
      - "src/**"
      - "pipeline/**"
      - "infra/**"
      - ".github/workflows/**"

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Run gitleaks
        # --no-git scans the checked-out tree; no organisation licence is needed.
        run: ./gitleaks detect --source . --no-git --redact --exit-code 1 --config .gitleaks.toml

  sast:
    name: Static analysis (bandit, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners
        run: python -m pip install --upgrade "bandit[sarif]" semgrep
      - name: Bandit (SARIF, high severity gate)
        run: bandit -r src pipeline/mbse -f sarif -o bandit.sarif --severity-level high
      - name: Semgrep (SARIF, error severity gate)
        run: semgrep --config=p/python --sarif --sarif-output=semgrep.sarif --severity ERROR --error
      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies:
    name: Dependency audit (pip-audit, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Freeze project dependencies
        # Exclude pip/setuptools and the editable project so the audit covers
        # only what the project actually ships with.
        run: |
          python -m pip freeze \
            --exclude pip \
            --exclude setuptools \
            --exclude wheel \
            --exclude digital-thread-validator \
            > audit-requirements.txt
      - name: Install audit tooling
        run: python -m pip install pip-audit cyclonedx-bom
      - name: pip-audit
        run: pip-audit -r audit-requirements.txt --strict
      - name: CycloneDX SBOM
        run: |
          mkdir -p build/reports
          cyclonedx-py environment --output-file build/reports/sbom.json --output-format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/reports/sbom.json
          if-no-files-found: warn

  container-fs:
    name: Filesystem scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  iac:
    name: Infrastructure as code (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

  summary:
    name: Security gate (mbse security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run security gate
        run: mbse security
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/security.json
            build/reports/security.sarif
          if-no-files-found: warn
