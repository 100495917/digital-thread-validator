[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-thread-validator"
version = "0.1.0"
description = "MBSE DevOps pipeline with digital thread for the Smart Thermostat Controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx>=0.27",
    "networkx",
    "pyyaml",
    "mkdocs-material",
    "bandit",
    "pip-audit",
    "cyclonedx-bom",
    "pre-commit",
    "yamllint",
    "ruff",
]

[project.scripts]
mbse = "mbse.cli:main"

[tool.setuptools]
package-dir = {"" = "pipeline"}
packages = ["mbse", "mbse.templates"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipeline/tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --junitxml=build/reports/junit.xml --cov --cov-report=term-missing --cov-report=xml:build/reports/coverage.xml --cov-report=html:build/htmlcov"
markers = [
    "req: requirement-based test",
    "perf: performance test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["pipeline/mbse", "src/thermostat"]

[tool.setuptools.package-data]
mbse = ["templates/*.j2"]

