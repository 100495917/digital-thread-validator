repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: yamllint
        name: yamllint
        entry: >-
          yamllint --config-data
          '{extends: default, rules: {line-length: {max: 120}, quoted-strings: disable}}'
        language: system
        types: [yaml]

      - id: mbse-validate
        name: mbse validate all
        entry: mbse validate all
        language: system
        files: ^(requirements|models)/.*\.ya?ml$
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (staged)
        entry: >-
          bash -c 'if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact; else echo "gitleaks not installed; skipping"; fi'
        language: system
        pass_filenames: false
