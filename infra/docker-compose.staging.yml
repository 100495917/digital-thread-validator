services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-local/digital-thread-validator}:${IMAGE_TAG:-staging}
    ports:
      - "8000:8000"
    environment:
      THERMOSTAT_API_TOKEN: ${THERMOSTAT_API_TOKEN:-dev-token}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    restart: unless-stopped
